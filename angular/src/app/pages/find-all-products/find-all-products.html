<app-page-header
  title="Find All Products"
  description="View all available products."
></app-page-header>

<div class="p-4">
  <div *ngIf="loading" class="flex justify-center items-center py-8">
    <div class="text-gray-600">Loading products...</div>
  </div>

  <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-4">
    {{ error }}
  </div>

  <div *ngIf="!loading && products.length > 0">
    <app-products-table [products]="products"></app-products-table>
  </div>

  <div *ngIf="!loading && products.length === 0 && !error" class="text-center py-8 text-gray-500">
    No products found
  </div>
</div>
