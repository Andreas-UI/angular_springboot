<app-page-header
  title="Find Product by ID"
  description="Search for a specific product using its ID."
></app-page-header>

<form class="max-w-2xl mx-auto" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div>
    <label for="Product ID" class="block text-sm font-medium text-slate-900 mb-2">Product ID</label>
    <div class="flex gap-2">
      <input
        id="product_id"
        type="number"
        formControlName="product_id"
        placeholder="Enter product ID"
        class="flex-1 px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      />
      <button
        type="submit"
        [disabled]="!form.valid || submitLoading"
        class="px-6 py-2 bg-blue-500 hover:bg-blue-600 disabled:bg-slate-400 text-white font-semibold rounded-lg transition-colors duration-300 whitespace-nowrap"
      >
        {{ submitLoading ? 'Loading...' : 'Search' }}
      </button>
    </div>
    <div *ngIf="id && id.invalid && id.touched" class="text-red-500 text-sm mt-1">
      <p *ngIf="id.errors?.['required']">ID is required</p>
      <p *ngIf="id.errors?.['min']">ID must be at least 1</p>
    </div>
  </div>
</form>

<div class="max-w-2xl mx-auto mt-8">
  <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-4">
    {{ error }}
  </div>

  <div
    *ngIf="product$ | async as product"
    class="bg-green-50 border border-green-200 p-4 rounded-lg"
  >
    <h3 class="text-lg font-semibold text-green-900 mb-3">Product Found</h3>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <p class="text-sm text-gray-600">ID</p>
        <p class="font-semibold">{{ product.id }}</p>
      </div>
      <div>
        <p class="text-sm text-gray-600">Name</p>
        <p class="font-semibold">{{ product.name }}</p>
      </div>
      <div>
        <p class="text-sm text-gray-600">Price</p>
        <p class="font-semibold">${{ product.price }}</p>
      </div>
      <div>
        <p class="text-sm text-gray-600">Quantity</p>
        <p class="font-semibold">{{ product.quantity }}</p>
      </div>
    </div>
    <div class="mt-3" *ngIf="product.description">
      <p class="text-sm text-gray-600">Description</p>
      <p class="text-gray-800">{{ product.description }}</p>
    </div>
  </div>
</div>
