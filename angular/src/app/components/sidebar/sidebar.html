<aside class="fixed w-64 h-full bg-gray-50 border-r border-gray-200 shadow-sm flex flex-col overflow-y-auto">
  <nav class="flex flex-col gap-0 flex-1">
    <a
      *ngFor="let item of menuItems"
      [routerLink]="item.route"
      routerLinkActive="bg-gray-100 border-l-blue-500 text-gray-900 font-medium"
      class="block px-5 py-4 text-gray-700 no-underline transition-all duration-300 border-l-4 border-transparent cursor-pointer text-sm hover:bg-gray-100"
    >
      {{ item.label }}
    </a>
  </nav>
</aside>
